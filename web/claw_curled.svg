<svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 38 38" fill="none">
  <defs>
    <linearGradient id="strikeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curledBladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <radialGradient id="flexedPadGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fda4af"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="impactWave" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Impact Strike Shockwave Rings on Click -->
  <circle cx="8" cy="8" r="7" stroke="url(#strikeGrad)" stroke-width="1.6" stroke-dasharray="3 2" fill="none"/>
  <circle cx="8" cy="8" r="3.5" fill="url(#impactWave)"/>
  <path d="M8 1 L8 4" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M1 8 L4 8" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M13 13 L15 15" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Furry Paw Base Clenched -->
  <path d="M14 38 C14 26, 17 22, 23 22 C29 22, 33 26, 33 38 Z" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>

  <!-- Digit 1 Clenched & Curled Talon (Tightly Hooked Inward) -->
  <path d="M5 8 C6 5, 9 6, 10 9 C11 12, 8 15, 6 14 C4 13, 3 10, 5 8 Z" fill="#27272a" stroke="#ef4444" stroke-width="0.8"/>
  <path d="M7 6 C9 8, 10 11, 8 13 C7 11, 6 9, 7 6 Z" fill="url(#curledBladeGrad)" stroke="#ef4444" stroke-width="0.7"/>

  <!-- Digit 2 Clenched & Curled Talon -->
  <path d="M13 7 C14 4, 18 5, 19 8 C20 11, 17 14, 15 13 C13 12, 12 9, 13 7 Z" fill="#27272a" stroke="#ef4444" stroke-width="0.8"/>
  <path d="M15 5 C17 7, 18 10, 16 12 C15 10, 14 8, 15 5 Z" fill="url(#curledBladeGrad)" stroke="#ef4444" stroke-width="0.7"/>

  <!-- Digit 3 Clenched & Curled Talon -->
  <path d="M22 8 C23 5, 26 6, 27 9 C28 12, 25 15, 23 14 C21 13, 21 10, 22 8 Z" fill="#27272a" stroke="#ef4444" stroke-width="0.8"/>
  <path d="M24 6 C25 8, 26 11, 24 13 C23 11, 23 9, 24 6 Z" fill="url(#curledBladeGrad)" stroke="#ef4444" stroke-width="0.7"/>

  <!-- Digit 4 Outer Claw Curled -->
  <path d="M29 12 C30 9, 33 11, 33 14 C33 17, 30 19, 28 17 C27 16, 28 13, 29 12 Z" fill="#27272a" stroke="#ef4444" stroke-width="0.8"/>
  <path d="M30 10 C31 12, 32 15, 30 16 C29 14, 29 12, 30 10 Z" fill="url(#curledBladeGrad)" stroke="#ef4444" stroke-width="0.7"/>

  <!-- Compressed Pressed Toe Pads (Expanded under pressure) -->
  <ellipse cx="10" cy="16" rx="3.8" ry="3.2" fill="#27272a" stroke="#ef4444" stroke-width="1"/>
  <ellipse cx="9.8" cy="16" rx="2.8" ry="2.2" fill="url(#flexedPadGlow)"/>

  <ellipse cx="16" cy="15" rx="3.8" ry="3.2" fill="#27272a" stroke="#ef4444" stroke-width="1"/>
  <ellipse cx="16" cy="15" rx="2.8" ry="2.2" fill="url(#flexedPadGlow)"/>

  <ellipse cx="23" cy="16" rx="3.8" ry="3.2" fill="#27272a" stroke="#ef4444" stroke-width="1"/>
  <ellipse cx="23.2" cy="16" rx="2.8" ry="2.2" fill="url(#flexedPadGlow)"/>

  <ellipse cx="29" cy="19" rx="3.4" ry="2.8" fill="#27272a" stroke="#ef4444" stroke-width="1"/>
  <ellipse cx="29" cy="19" rx="2.4" ry="1.9" fill="url(#flexedPadGlow)"/>

  <!-- Flexed Main Palm Pad -->
  <path d="M16 25 C16 21, 19 20, 24 20 C29 20, 32 21, 32 25 C32 29, 29 33, 24 33 C19 33, 16 29, 16 25 Z" fill="#27272a" stroke="#ef4444" stroke-width="1.3"/>
  <path d="M17.5 25 C17.5 22, 20.5 21, 24 21 C27.5 21, 30.5 22, 30.5 25 C30.5 28.5, 27.5 31.5, 24 31.5 C20.5 31.5, 17.5 28.5, 17.5 25 Z" fill="url(#flexedPadGlow)"/>
  <ellipse cx="24" cy="24" rx="3.5" ry="2" fill="#ffffff" opacity="0.6"/>
</svg>